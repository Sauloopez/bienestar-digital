{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienestar Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Asap&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Asap&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style_home.css'%}">
    
</head>
<body>
    <header>
        <nav>
            <div class="navbar">
              <div class="container nav-container">
                  <input class="checkbox" type="checkbox" name="" id="" />
                  <div class="hamburger-lines">
                    <span class="line line1"></span>
                    <span class="line line2"></span>
                    <span class="line line3"></span>
                  </div>  
                <div class="logo">
                  <h1 class="nav_title"><a href="{% url 'index'%}">Bienestar Digital</a></h1>
                </div>
                <div class="menu-items">
                  <li><a href="{% url 'registry_student' %}">Registro de Estudiante</a></li>
                  <li><a href="{% url 'mark_asistence' %}">Asistencia</a></li>
                  {% if user.is_authenticated %}
                  <li><a href="{% url 'logout'%}">Salir</a></li>
                  {% else %}
                  <li><a href="{% url 'login'%}">Control</a></li>
                  {% endif %}
                </div>
              </div>
            </div>
          </nav>
    </header>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
