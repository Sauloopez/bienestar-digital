{% extends "base.html" %}

{% block content %}
<div>
    <div>
        {% if error %}
            <div>
                {{ error }}
            </div>
        {% endif %}
        <form method="post" >
        {% csrf_token %}
        {% if request.GET.next%}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% else %}
        <input type="hidden" name="next" value="/">
        {% endif %}
        <div>
            {{ form.username.label_tag }}
        </div>
        <div>
            {{ form.username }}
        </div>
        <div>
            {{ form.password.label_tag }}
        </div>
        <div>
            {{ form.password }}
        </div>
        <button type="submit">Enviar</button>
        </form>
    </div>
</div>
{% endblock content %}
