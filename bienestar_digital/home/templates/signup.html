{% extends "base.html" %}

{% block content %}
<div>
    <div>
        <h2>Registry</h2>
        {% if error %}
            <div role="alert">
                {{ error }}
            </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div>
                {{ form.username.label_tag }}
                {{ form.username }}
            </div>
            <div>
                {{ form.password1.label_tag }}
                {{ form.password1 }}
            </div>
            <div>
                {{ form.password2.label_tag }}
                {{ form.password2 }}
            </div>
            <button type="submit">Enviar</button>
        </form>
    </div>
</div>
{% endblock content %}
